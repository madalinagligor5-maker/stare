    <style>
/* Stilurile jocului Mimi. Culori calde, butoane mari (minimum 56px), contrast bun. */

:root {
  --bg1: #fff0f7;
  --bg2: #ece6ff;
  --ink: #4a2d4f;
  --ink-soft: #7a5a80;
  --accent: #ff3f9a;
  --accent-2: #8a5cff;
  --ok: #22a866;
  --panel: rgba(255, 255, 255, 0.92);
  --shadow: 0 4px 0 rgba(90, 40, 90, 0.16), 0 6px 16px rgba(90, 40, 90, 0.12);
  --radius: 20px;
  --tap: 56px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}
button { font-family: inherit; }
input, textarea { font-family: inherit; user-select: text; -webkit-user-select: text; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---- Bara de sus ---- */
#topbar {
  display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 6px) 10px 6px;
  padding-left: calc(env(safe-area-inset-left) + 10px);
  padding-right: calc(env(safe-area-inset-right) + 10px);
  z-index: 5;
}
#scene-title {
  flex: 1; margin: 0; font-size: clamp(18px, 4.6vw, 26px); font-weight: 900;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--ink);
}
.star-pill {
  display: flex; align-items: center; gap: 4px; background: #fff; border-radius: 30px;
  padding: 8px 14px; font-weight: 900; font-size: 20px; min-height: 48px; box-shadow: var(--shadow);
}
.star-pill.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.25); } }
body[data-scene="menu"] #topbar { visibility: hidden; }
#btn-back[hidden] { visibility: hidden; display: inline-flex; }

#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }

/* ---- Scene și tranziții ---- */
.scene {
  position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
}
.enter-right { animation: enterR .3s ease both; }
.enter-left { animation: enterL .3s ease both; }
.leave-left { animation: leaveL .3s ease both; }
.leave-right { animation: leaveR .3s ease both; }
.enter-fade { animation: fadeIn .12s ease both; }
.leave-fade { animation: fadeOut .12s ease both; }
@keyframes enterR { from { transform: translateX(40px); opacity: 0; } }
@keyframes enterL { from { transform: translateX(-40px); opacity: 0; } }
@keyframes leaveL { to { transform: translateX(-40px); opacity: 0; } }
@keyframes leaveR { to { transform: translateX(40px); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }

/* ---- Butoane ---- */
.btn {
  min-height: var(--tap); min-width: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border: none; border-radius: 18px;
  background: #fff; color: var(--ink); font-weight: 800; font-size: 16px;
  box-shadow: var(--shadow); cursor: pointer; touch-action: manipulation;
  transition: transform .08s ease, box-shadow .08s ease, background .15s;
  position: relative;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(90, 40, 90, .16); }
.btn:focus-visible { outline: 4px solid var(--accent-2); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn-ico { font-size: 1.45em; line-height: 1; }
.btn-icon { width: var(--tap); padding: 0; border-radius: 50%; }
.btn-primary { background: linear-gradient(180deg, #ff6fb5, #ff3f9a); color: #fff; }
.btn-ok { background: linear-gradient(180deg, #43d58b, #22a866); color: #fff; }
.btn-soft { background: #f1ebff; }
.btn-violet { background: linear-gradient(180deg, #a685ff, #8a5cff); color: #fff; }
.btn-big { min-height: 72px; font-size: 22px; padding: 10px 24px; border-radius: 26px; }
.btn-col { flex-direction: column; gap: 2px; font-size: 13px; padding: 6px 8px; }
.btn-col .btn-ico { font-size: 30px; }
.btn.on { background: #ffe3f1; outline: 4px solid var(--accent); outline-offset: -2px; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-center { justify-content: center; }
.spacer { flex: 1; }
.hint { color: var(--ink-soft); font-weight: 700; font-size: 15px; text-align: center; margin: 4px 8px; }

/* ---- Meniu ---- */
.menu-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
.menu-title { font-size: clamp(44px, 13vw, 84px); font-weight: 900; margin: 0; color: var(--accent); text-shadow: 0 4px 0 #fff, 0 8px 0 rgba(255, 63, 154, .2); letter-spacing: 2px; }
.menu-sub { margin: 0; font-weight: 800; color: var(--ink-soft); font-size: 18px; text-align: center; }
.menu-mimi { width: min(62vw, 46vh, 360px); cursor: pointer; }
.menu-mimi svg { width: 100%; height: auto; display: block; overflow: visible; }
.menu-gear { position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 10px); }

/* ---- Acasă ---- */
.home { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.home-room { flex: 1; min-height: 0; position: relative; display: flex; justify-content: center; align-items: center; }
.home-room > svg { height: 100%; width: 100%; display: block; }
.needs { display: flex; gap: 6px; padding: 0 10px 6px; }
.need { flex: 1; background: var(--panel); border-radius: 14px; padding: 4px 6px; box-shadow: var(--shadow); text-align: center; min-width: 0; }
.need-top { display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; }
.need-ico { font-size: 18px; }
.need-bar { height: 10px; background: #f1e7f3; border-radius: 6px; overflow: hidden; margin-top: 3px; }
.need-fill { height: 100%; border-radius: 6px; transition: width .6s ease; }
.care-bar { display: flex; gap: 8px; justify-content: center; padding: 6px 10px; flex-wrap: wrap; }
.dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 10px 10px; background: var(--panel); border-radius: 24px 24px 0 0; }
.dock .btn { min-height: 64px; }
.mood-bubble { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 20px; padding: 6px 14px; font-weight: 800; box-shadow: var(--shadow); white-space: nowrap; font-size: 15px; z-index: 2; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.food-tray, .edit-tray { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 8px; background: var(--panel); padding: 8px; border-radius: 22px; box-shadow: var(--shadow); z-index: 3; }
.food { width: 64px; height: 64px; font-size: 38px; border-radius: 18px; background: #fff7fb; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; box-shadow: var(--shadow); }
.food.dragging { position: fixed; z-index: 50; pointer-events: none; transform: scale(1.2); }
.zzz { position: absolute; font-size: 32px; font-weight: 900; color: #fff; text-shadow: 0 2px 6px #6a5acd; animation: zzz 2.4s linear infinite; pointer-events: none; }
@keyframes zzz { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(30px, -80px) scale(1.2); opacity: 0; } }
.wand { position: fixed; width: 70px; height: 70px; font-size: 54px; pointer-events: none; z-index: 40; transform: translate(-50%, -50%); }

/* ---- Editoare (atelier, salon, cameră) ---- */
.editor { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.editor-stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; }
.editor-stage > svg { height: 100%; width: 100%; display: block; }
.stage-tools { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; pointer-events: none; }
.stage-tools > * { pointer-events: auto; }
.stage-tools .btn { min-height: 52px; min-width: 52px; }
.stage-bottom { position: absolute; bottom: 6px; left: 6px; right: 6px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; z-index: 2; pointer-events: none; }
.stage-bottom > * { pointer-events: auto; }
.editor-panel {
  background: var(--panel); border-radius: 24px 24px 0 0; padding: 8px 8px 10px;
  display: flex; flex-direction: column; gap: 6px; max-height: 48%; min-height: 0;
  box-shadow: 0 -4px 20px rgba(90, 40, 90, .12); overflow: hidden;
}
.panel-body { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
.panel-label { font-weight: 900; font-size: 14px; color: var(--ink-soft); margin: 2px 4px 0; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 3px 3px 5px; flex: 0 0 auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar, .options::-webkit-scrollbar, .swatches::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; flex-direction: column; gap: 0; padding: 4px 10px; font-size: 12px; min-width: 64px; }
.tab .btn-ico { font-size: 24px; }
.tab.on { background: linear-gradient(180deg, #ff8fc7, #ff3f9a); color: #fff; }
.options { display: flex; gap: 8px; overflow-x: auto; padding: 4px 3px 6px; flex: 0 0 auto; scrollbar-width: none; }
.opt { flex: 0 0 auto; flex-direction: column; gap: 2px; min-width: 76px; font-size: 12px; padding: 6px 8px; }
.opt .btn-ico { font-size: 30px; }
.opt-art svg { width: 54px; height: 54px; display: block; }
.opt.on { outline: 4px solid var(--accent); outline-offset: -3px; background: #fff0f8; }
.opt.locked { background: #f4f0f7; }
.opt.locked .btn-ico, .opt.locked .opt-art { opacity: .55; filter: grayscale(.4); }
.lock-badge { position: absolute; top: -6px; right: -4px; background: #ffd36b; color: #5a3a00; font-size: 11px; font-weight: 900; padding: 2px 6px; border-radius: 10px; }
.swatches { display: flex; gap: 8px; overflow-x: auto; padding: 4px 3px 6px; flex: 0 0 auto; scrollbar-width: none; }
.swatch { flex: 0 0 auto; width: var(--tap); height: var(--tap); border-radius: 50%; padding: 0; background: var(--sw); border: 4px solid #fff; }
.swatch.on { outline: 4px solid var(--accent); outline-offset: 0; transform: scale(1.05); }
.swatch-none { background: #fff; }
.slider { display: flex; align-items: center; gap: 8px; font-weight: 800; padding: 2px 6px; min-height: 56px; }
.slider-lbl { min-width: 74px; font-size: 14px; }
.slider input { flex: 1; height: 44px; accent-color: var(--accent); }
.palette-chip { display: inline-flex; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }

/* selecție (decor / obiect cameră) */
.sel-ring { animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -22; } }
.sel-top { top: 64px; justify-content: center; }
.sel-tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.sel-tools .btn { min-height: 56px; min-width: 56px; padding: 4px 8px; }

@media (orientation: landscape) and (min-width: 560px) {
  .editor { flex-direction: row; }
  .editor-panel { width: min(48%, 480px); max-height: none; border-radius: 24px 0 0 0; }
  .panel-body .options, .panel-body .swatches { flex-wrap: wrap; overflow: visible; }
  .home { flex-direction: row; flex-wrap: wrap; }
  .home .home-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
  .home .dock { width: min(36%, 340px); grid-template-columns: repeat(2, 1fr); border-radius: 24px 0 0 0; align-content: start; overflow-y: auto; height: 100%; }
}
.home-main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.home-mid { flex: 1; display: flex; flex-direction: column; min-height: 0; }
@media (orientation: landscape) and (min-width: 560px) {
  .home-mid { flex-direction: row; }
  .home-mid .care-bar { display: grid; grid-template-columns: repeat(2, auto); align-content: center; padding: 4px 8px; overflow-y: auto; }
  .home-mid .care-bar .btn { min-height: 56px; padding: 2px 8px; }
  .home-mid .care-bar .btn-col .btn-ico { font-size: 24px; }
}

/* ---- Liste / grile ---- */
.scroll { flex: 1; overflow-y: auto; min-height: 0; padding: 8px 10px 16px; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; position: relative; }
.card-art { background: linear-gradient(180deg, #fff6fb, #f3eaff); border-radius: 14px; display: flex; justify-content: center; align-items: center; aspect-ratio: 1 / 1; overflow: hidden; }
.card-art svg { width: 100%; height: 100%; }
.card-title { font-weight: 900; font-size: 15px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.card-actions .btn { padding: 4px 8px; min-height: 56px; min-width: 56px; }
.fav-btn { position: absolute; top: 4px; right: 4px; z-index: 2; background: rgba(255,255,255,.9); }
.empty { text-align: center; padding: 30px 16px; font-weight: 800; color: var(--ink-soft); font-size: 18px; }
.empty .big { font-size: 64px; display: block; margin-bottom: 8px; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px 4px; flex: 0 0 auto; scrollbar-width: none; }
.filters .btn { flex: 0 0 auto; }
.price { font-weight: 900; color: #a06b00; }
.owned-badge { background: #d9f7e8; color: #13744a; border-radius: 12px; padding: 4px 8px; font-weight: 900; font-size: 13px; text-align: center; }
.section-title { font-weight: 900; font-size: 20px; margin: 14px 4px 8px; }
.progress { height: 14px; background: #f1e7f3; border-radius: 8px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, #ff8fc7, #8a5cff); border-radius: 8px; transition: width .4s; }

/* ---- Misiuni ---- */
.quest { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow); margin-bottom: 10px; }
.quest-ico { font-size: 38px; }
.quest-main { flex: 1; min-width: 0; }
.quest-text { font-weight: 900; font-size: 17px; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.badge { background: #fff; border-radius: 18px; padding: 10px 6px; text-align: center; box-shadow: var(--shadow); }
.badge .b-ico { font-size: 40px; display: block; }
.badge .b-name { font-weight: 900; font-size: 13px; }
.badge .b-desc { font-size: 11px; color: var(--ink-soft); font-weight: 700; }
.badge.locked { opacity: .45; filter: grayscale(1); }

/* ---- Mini-jocuri ---- */
.game-area { flex: 1; position: relative; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; gap: 10px; touch-action: none; }
.game-hud { display: flex; justify-content: center; gap: 10px; align-items: center; font-weight: 900; font-size: 18px; padding: 6px; }
.mem-grid { display: grid; gap: 8px; width: min(96vw, 560px, 70vh); }
.mem-card { aspect-ratio: 3 / 4; border-radius: 16px; border: none; background: linear-gradient(160deg, #ff8fc7, #8a5cff); box-shadow: var(--shadow); padding: 0; cursor: pointer; position: relative; perspective: 600px; min-height: 56px; }
.mem-card .face { position: absolute; inset: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; transition: transform .35s ease; }
.mem-card .front { background: #fff; transform: rotateY(180deg); }
.mem-card .back { font-size: 34px; color: #fff; }
.mem-card.open .front { transform: rotateY(0); }
.mem-card.open .back { transform: rotateY(-180deg); }
.mem-card.done { animation: pop .4s ease; }
.mem-card svg { width: 90%; height: 90%; }
@keyframes pop { 50% { transform: scale(1.1); } }
.pots { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.pot { width: 84px; height: 84px; border-radius: 50%; border: 6px solid #fff; box-shadow: var(--shadow); cursor: pointer; padding: 0; overflow: hidden; }
.pot svg { width: 100%; height: 100%; }
.pot.wiggle { animation: wiggle .4s ease; }
@keyframes wiggle { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.sort-boxes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; }
.sort-box { flex: 1 1 120px; max-width: 180px; min-height: 110px; background: #fff; border-radius: 22px; border: 4px dashed #d9c8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; box-shadow: var(--shadow); }
.sort-box .sb-ico { font-size: 40px; }
.sort-box.hot { border-color: var(--accent); background: #fff0f8; }
.sort-items { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 90px; }
.sort-item { width: 76px; height: 76px; background: #fff; border-radius: 18px; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; }
.sort-item svg { width: 68px; height: 68px; }
.sort-item.dragging { position: fixed; z-index: 60; pointer-events: none; transform: scale(1.15); }
.bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(180,230,255,.5) 40%, rgba(160,140,255,.35)); border: 2px solid rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; touch-action: none; }
.puzzle-board { position: relative; background: #fff; border-radius: 18px; box-shadow: var(--shadow); }
.puzzle-slot { position: absolute; border: 2px dashed #e1d3ef; box-sizing: border-box; }
.puzzle-piece { position: absolute; border-radius: 8px; box-shadow: 0 3px 10px rgba(0,0,0,.18); touch-action: none; cursor: grab; overflow: hidden; background: #fff; }
.puzzle-piece.placed { box-shadow: none; cursor: default; border-radius: 0; }
.puzzle-piece svg { display: block; }

/* ---- Podium / defilare ---- */
.runway { flex: 1; position: relative; overflow: hidden; background: linear-gradient(180deg, #3b2363, #8a5cff 70%, #ffb3d9); }
.runway svg.rw { position: absolute; inset: 0; width: 100%; height: 100%; }
.scores { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 10px; }
.judge { background: #fff; border-radius: 18px; padding: 8px 12px; text-align: center; font-weight: 900; box-shadow: var(--shadow); animation: pop .4s ease both; }
.judge .j-ico { font-size: 34px; display: block; }

/* ---- Foto ---- */
.photo-stage svg { max-width: 100%; max-height: 100%; border-radius: 16px; box-shadow: var(--shadow); }
.flash { position: fixed; inset: 0; background: #fff; z-index: 80; animation: flash .5s ease forwards; pointer-events: none; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.album-view svg, .album-view img { width: 100%; height: auto; border-radius: 14px; display: block; }

/* ---- Croitorie ---- */
.tailor-steps { display: flex; gap: 6px; justify-content: center; padding: 4px; }
.step-dot { width: 46px; height: 46px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: var(--shadow); opacity: .55; }
.step-dot.on { opacity: 1; outline: 3px solid var(--accent); }
.step-dot.done { opacity: 1; background: #d9f7e8; }

/* ---- Părinți ---- */
.parents { max-width: 640px; margin: 0 auto; width: 100%; }
.set-row { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 18px; padding: 8px 12px; margin-bottom: 10px; box-shadow: var(--shadow); flex-wrap: wrap; }
.set-row .set-lbl { font-weight: 900; flex: 1; min-width: 140px; }
.set-row .slider { flex: 1; min-width: 200px; }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; justify-content: center; margin-top: 10px; }
.keypad .btn { font-size: 26px; min-height: 64px; }
.gate-q { font-size: 34px; font-weight: 900; text-align: center; margin: 4px 0; }
.gate-a { font-size: 30px; font-weight: 900; text-align: center; min-height: 44px; background: #f6f0fb; border-radius: 14px; padding: 4px; letter-spacing: 4px; }
.text-input, .text-area { width: 100%; font-size: 20px; padding: 12px; border-radius: 14px; border: 3px solid #e3d4f2; color: var(--ink); background: #fff; }
.text-area { font-size: 13px; height: 120px; resize: vertical; }
.text-input:focus, .text-area:focus { outline: none; border-color: var(--accent-2); }
.rest { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 12px; background: linear-gradient(180deg, #2b2f6b, #6a5acd); color: #fff; }
.rest h2 { font-size: 28px; margin: 0; }
.rest svg { width: min(60vw, 40vh, 300px); }

/* ---- Ferestre, mesaje, efecte ---- */
#modals { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
.modal-overlay { position: fixed; inset: 0; background: rgba(60, 30, 70, .45); display: flex; align-items: center; justify-content: center; padding: 16px; pointer-events: auto; animation: fadeIn .2s ease; }
.modal-overlay.out { animation: fadeOut .2s ease forwards; pointer-events: none; }
.modal { background: #fff; border-radius: 28px; padding: 18px 16px 16px; width: min(460px, 100%); max-height: 92vh; overflow-y: auto; text-align: center; position: relative; box-shadow: 0 20px 60px rgba(60, 20, 80, .35); animation: modalIn .25s ease; }
@keyframes modalIn { from { transform: scale(.9); opacity: 0; } }
.modal-ico { font-size: 54px; }
.modal-title { font-size: 22px; margin: 6px 30px 10px; }
.modal-body { margin-bottom: 12px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.modal-x { position: absolute; top: 8px; right: 8px; background: #f6f0fb; box-shadow: none; }
#toasts { position: fixed; top: calc(env(safe-area-inset-top) + 72px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 90; }
.toast { background: #fff; border-radius: 20px; padding: 10px 16px; font-weight: 800; box-shadow: var(--shadow); display: flex; gap: 8px; align-items: center; animation: toastIn .3s ease; max-width: 92vw; }
.toast.out { animation: fadeOut .4s ease forwards; }
.toast-ico { font-size: 24px; }
@keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 95; overflow: hidden; }
.particle { position: absolute; font-size: 26px; transform: translate(-50%, -50%); animation: particle 1.1s ease-out forwards; }
@keyframes particle { to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(.4); opacity: 0; } }
.fly-star { position: absolute; font-size: 28px; transform: translate(-50%, -50%); animation: fly .9s cubic-bezier(.5, -.3, .7, 1) forwards; }
@keyframes fly { 0% { transform: translate(-50%, -50%) scale(.5); } 20% { transform: translate(-50%, -50%) scale(1.4); } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.6); opacity: .6; } }
.twinkle { animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .2; } }
.bulb { animation: twinkle 2s ease-in-out infinite; }
.bulb:nth-child(2n) { animation-delay: .7s; }

#file-warning { position: fixed; inset: 0; background: var(--bg1); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
#file-warning[hidden] { display: none; }
.fw-box { max-width: 480px; background: #fff; border-radius: 26px; padding: 20px; text-align: center; box-shadow: var(--shadow); font-size: 17px; }
.fw-ico { font-size: 60px; }

/* ---- Mișcare redusă ---- */
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
  animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important;
}
body.reduce-motion .twinkle, body.reduce-motion .bulb, body.reduce-motion .zzz, body.reduce-motion .sel-ring { animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  .twinkle, .bulb, .sel-ring { animation: none; }
}

@media (max-height: 520px) {
  :root { --tap: 56px; }
  #topbar { padding-top: calc(env(safe-area-inset-top) + 2px); padding-bottom: 2px; }
  .need-top span:not(.need-ico) { display: none; }
}
@media (max-width: 520px) {
  .need-top span:not(.need-ico) { display: none; }
}
@media (max-width: 380px) {
  .btn { font-size: 14px; padding: 6px 10px; }
  .dock { gap: 6px; }
}

/* ================================================================
   Aspect nou (după modelul cerut): lucios, roz-lila, butoane-bomboană
   ================================================================ */
:root {
  --bg1: #ffe6f3;
  --bg2: #e9dcff;
  --pink: #ff5fa8;
  --pink-2: #ff8cc6;
  --lilac: #b693ff;
  --shadow: 0 3px 0 rgba(214, 120, 170, .35), 0 8px 18px rgba(170, 90, 160, .18);
  --panel: rgba(255, 255, 255, .86);
}
body { background: radial-gradient(circle at 20% 10%, #fff 0, transparent 40%), linear-gradient(165deg, var(--bg1), var(--bg2)); }
.btn {
  background: linear-gradient(180deg, #fff 0%, #fff4fa 60%, #ffe4f1 100%);
  border: 2px solid #fff;
  box-shadow: var(--shadow), inset 0 -3px 0 rgba(255, 150, 200, .25);
  color: #6a3570;
}
.btn-primary { background: linear-gradient(180deg, #ff9ccf 0%, #ff5fa8 55%, #f2448f 100%); color: #fff; text-shadow: 0 1px 0 rgba(160, 20, 80, .35); }
.btn-ok { background: linear-gradient(180deg, #7fe3b0 0%, #34c47c 60%, #22a866 100%); color: #fff; }
.btn-violet { background: linear-gradient(180deg, #cdb4ff 0%, #9b6bff 60%, #8452f0 100%); color: #fff; }
.btn-soft { background: linear-gradient(180deg, #fff, #f3ebff); }
#scene-title {
  font-size: clamp(20px, 5.4vw, 30px);
  background: linear-gradient(180deg, #ff8cc6, #e93f8f);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #fff) drop-shadow(0 3px 3px rgba(200, 60, 130, .25));
}
.star-pill { background: linear-gradient(180deg, #fff, #fff4d6); border: 2px solid #fff; color: #7a4a00; }
.menu-title {
  background: linear-gradient(180deg, #ffa6d4 0%, #ff4f9e 70%, #e0328a 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #fff) drop-shadow(0 8px 10px rgba(220, 60, 140, .35));
  text-shadow: none;
}

// Salvare în localStorage, cu versiune de schemă și migrare de la versiunile vechi.
// Funcționează cu orice obiect de tip "storage" (getItem/setItem/removeItem),
// de aceea poate fi testat și în Node.

const { SCHEMA_VERSION, defaultState, defaultDesign } = __require('src/core/defaults.js');
const { deepMerge, clone, isPlainObject, uid } = __require('src/core/util.js');

const SAVE_KEY = 'mimi-salon-save';
const EXPORT_APP = 'mimi-salon';

// Fiecare migrare duce salvarea de la versiunea N la N+1.
const MIGRATIONS = {
  // v1 (prima variantă): { version:1, stars, petName, dresses:[{name,type,color}] }
  1(data) {
    const wardrobe = (Array.isArray(data.dresses) ? data.dresses : []).map((d, i) => ({
      id: uid('d'),
      name: String(d.name || `Rochia ${i + 1}`),
      fav: false,
      created: Date.now(),
      design: { ...defaultDesign(), type: d.type || 'scurta', colorA: d.color || '#ff8fc7' },
    }));
    return {
      version: 2,
      stars: Number(data.stars) || 0,
      pet: { name: data.petName || 'Angy' },
      wardrobe,
      dailyLimit: data.dailyLimit || 0,
    };
  },
  // v2 -> v3: setările au fost mutate în `settings`, limita zilnică redenumită.
  2(data) {
    const out = { ...data, version: 3 };
    out.settings = { ...(data.settings || {}) };
    if (data.dailyLimit !== undefined) {
      out.settings.dailyLimitMin = Number(data.dailyLimit) || 0;
      delete out.dailyLimit;
    }
    if (data.muted !== undefined) { out.settings.muted = !!data.muted; delete out.muted; }
    return out;
  },
};

// Primește orice obiect salvat și întoarce o stare completă, la zi.
function migrate(raw, now = Date.now()) {
  if (!isPlainObject(raw)) return defaultState(now);
  let data = clone(raw);

  if (version > SCHEMA_VERSION) version = SCHEMA_VERSION; // salvare dintr-o versiune mai nouă: încercăm totuși
  while (version < SCHEMA_VERSION) {
    const step = MIGRATIONS[version];
    if (!step) break;
    data = step(data);
    version = Number(data.version) || version + 1;
  }
  const merged = deepMerge(defaultState(now), data);
  merged.version = SCHEMA_VERSION;
  return sanitize(merged);
}

// Corecturi de siguranță (valori imposibile -> valori bune).
function sanitize(s) {
  s.stars = Math.max(0, Math.floor(Number(s.stars) || 0));
  if (!Array.isArray(s.owned)) s.owned = [];
  if (!Array.isArray(s.wardrobe)) s.wardrobe = [];
  s.wardrobe = s.wardrobe.filter((w) => isPlainObject(w) && isPlainObject(w.design))
    .map((w) => ({ id: w.id || uid('d'), name: String(w.name || 'Rochie'), fav: !!w.fav, created: w.created || Date.now(), design: deepMerge(defaultDesign(), w.design) }));
  if (!Array.isArray(s.album)) s.album = [];
  if (!Array.isArray(s.room.items)) s.room.items = [];
  for (const k of Object.keys(s.pet.needs)) {
    s.pet.needs[k] = Math.max(0, Math.min(100, Number(s.pet.needs[k]) || 0));
  }
  if (!s.pet.name || typeof s.pet.name !== 'string') s.pet.name = 'Angy';
  return s;
}

function createSaveManager(storage, key = SAVE_KEY) {
  return {
    // Încarcă salvarea; dacă nu există sau e stricată, pornește de la zero.
    load(now = Date.now()) {
      let raw = null;
      try { raw = storage.getItem(key); } catch { raw = null; }
      if (!raw) return { state: defaultState(now), fresh: true };
      try {
        return { state: migrate(JSON.parse(raw), now), fresh: false };
      } catch {
        return { state: defaultState(now), fresh: true, recovered: true };
      }
    },
    save(state) {
      try {
        storage.setItem(key, JSON.stringify(state));
        return true;
      } catch (err) {
        return false; // spațiu plin sau stocare blocată
      }
    },
    reset() {
      try { storage.removeItem(key); } catch { /* nimic */ }
    },
    exportData(state) {
      return JSON.stringify({ app: EXPORT_APP, exportedAt: new Date().toISOString(), data: state }, null, 1);
    },
    // Aruncă o eroare cu mesaj prietenos dacă textul nu e o salvare validă.
    importData(text, now = Date.now()) {
      let parsed;
      try { parsed = JSON.parse(String(text)); } catch {
        throw new Error('Fișierul nu este o salvare Angy.');
      }
      const data = isPlainObject(parsed) && parsed.app === EXPORT_APP ? parsed.data : parsed;
      if (!isPlainObject(data) || !('version' in data || 'stars' in data || 'pet' in data)) {
        throw new Error('Fișierul nu este o salvare Angy.');
      }
      return migrate(data, now);
    },
  };
}

Object.assign(__exports, { SAVE_KEY, EXPORT_APP, MIGRATIONS, migrate, createSaveManager });
};

// Economia cu stele ⭐: câștig, cumpărare, colecții. Funcții pure peste stare.

function addStars(state, amount) {
  const n = Math.max(0, Math.floor(Number(amount) || 0));
  state.stars += n;
  state.totalStars = (state.totalStars || 0) + n;
  return n;
}

// Un obiect e deblocat dacă e gratuit sau a fost cumpărat.
function isUnlocked(state, item) {
  if (!item) return false;
  if (!item.price) return true;
  return state.owned.includes(item.id);
}

function canAfford(state, item) {
  return !!item && state.stars >= (item.price || 0);
}

// Cumpără un obiect. Întoarce { ok, reason }.
function buyItem(state, item) {
  if (!item) return { ok: false, reason: 'missing' };
  if (isUnlocked(state, item)) return { ok: false, reason: 'owned' };
  if (!canAfford(state, item)) return { ok: false, reason: 'poor', missing: item.price - state.stars };
  state.stars -= item.price;
  state.owned.push(item.id);
  return { ok: true };
}

// Cât din colecție e deblocat: { have, total, complete }.
function collectionProgress(state, collectionId, allItems) {
  const items = allItems.filter((it) => it.collection === collectionId);
  const have = items.filter((it) => isUnlocked(state, it)).length;
  return { have, total: items.length, complete: items.length > 0 && have === items.length };
}

};

__defs['src/core/pet.js'] = function (__exports) {
// Nevoile blânde ale lui Angy. Scad încet și nu ajung niciodată la zero.

const { clamp } = __require('src/core/util.js');

const NEEDS = [
  { id: 'hunger', name: 'Mâncare', icon: '🐟', color: '#ffb36b' },
  { id: 'play', name: 'Joacă', icon: '🧶', color: '#8fd3ff' },
  { id: 'clean', name: 'Curățenie', icon: '🫧', color: '#9ee6c9' },
  { id: 'sleep', name: 'Somn', icon: '🌙', color: '#b9a6ff' },
  { id: 'love', name: 'Iubire', icon: '💗', color: '#ff9cc8' },
];

const NEED_FLOOR = 25;         // sub atât nu coboară niciodată
const WELCOME_AFTER_MIN = 180; // după 3 ore de pauză, Angy te întâmpină
// puncte pierdute pe minut (100 -> 25 în câteva ore)
const RATE = { hunger: 1 / 5, play: 1 / 6, clean: 1 / 8, sleep: 1 / 9, love: 1 / 6 };

// Aplică trecerea timpului. Întoarce câte minute au trecut.
function decayNeeds(pet, now = Date.now()) {
  const minutes = Math.max(0, (now - (Number.isFinite(pet.lastTick) ? pet.lastTick : now)) / 60000);
  for (const k of Object.keys(RATE)) {
    const cur = pet.needs[k] ?? 80;
    let rate = RATE[k];
    if (k === 'sleep' && pet.sleeping) rate = -2; // doarme: se odihnește
    const next = cur - rate * minutes;
    pet.needs[k] = clamp(cur < NEED_FLOOR ? Math.max(cur, next) : Math.max(NEED_FLOOR, next), 0, 100);
  }
  pet.lastTick = now;
  return minutes;
}

function care(pet, need, amount) {
  pet.needs[need] = clamp((pet.needs[need] ?? 0) + amount, 0, 100);
  return pet.needs[need];
}

function lowestNeed(pet) {
  return NEEDS.map((n) => ({ ...n, value: pet.needs[n.id] })).sort((a, b) => a.value - b.value)[0];
}

// Emoția generală: 'adormita' | 'mofturoasa' | 'fericita'
function moodOf(pet, phase) {
  if (pet.sleeping) return 'adormita';
  const low = lowestNeed(pet);
  if (low.value < 40) return 'mofturoasa';
  if (phase === 'night' && pet.needs.sleep < 60) return 'adormita';
  return 'fericita';
}

// Ciclu zi/noapte după ora reală.
function dayPhase(date = new Date()) {
  const h = date.getHours() + date.getMinutes() / 60;
  if (h >= 6.5 && h < 9) return 'morning';
  if (h >= 9 && h < 18.5) return 'day';
  if (h >= 18.5 && h < 21) return 'evening';
  return 'night';
}

const PHASE_NAMES = { morning: 'Dimineață', day: 'Zi', evening: 'Seară', night: 'Noapte' };

// Nivelul (inimioara de sus): crește cu stelele câștigate vreodată. Nu scade niciodată.
const STARS_PER_LEVEL = 50;
function levelInfo(totalStars = 0) {
  const t = Math.max(0, Math.floor(totalStars));
  return { level: 1 + Math.floor(t / STARS_PER_LEVEL), progress: (t % STARS_PER_LEVEL) / STARS_PER_LEVEL };
}

Object.assign(__exports, { NEEDS, NEED_FLOOR, WELCOME_AFTER_MIN, decayNeeds, care, lowestNeed, moodOf, dayPhase, PHASE_NAMES, STARS_PER_LEVEL, levelInfo });
};

// Ajutoare pentru desenul SVG făcut în cod.

    const a = ((rot + (i * 180) / k) * Math.PI) / 180;
    pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(' ');

  stea: (c) => `<polygon points="${starPoints(0, 0, 10, 4.5)}" fill="${c}"/>`,

  luna: (c) => `<path d="M3 -10 A10 10 0 1 0 3 10 A7.5 7.5 0 1 1 3 -10 Z" fill="${c}"/>`,

__defs['src/art/mimiLive.js'] = function (__exports) {
// Angy "vie": respiră, clipește, mișcă urechile și coada, se uită după deget,
// reacționează diferit când o atingi pe cap, pe burtică sau pe coadă.

const { renderFigure } = __require('src/art/figure.js');
const { newPrefix } = __require('src/art/svg.js');

const EXPR_BY_MOOD = { fericita: 'happy', mofturoasa: 'pout', adormita: 'sleep', curioasa: 'curious' };

class MimiLive {
  // group: un <g> din SVG în care se desenează Angy
  constructor(group, { getLook, getDesign = () => null, scope, audio = null, reducedMotion = () => false, onReact = null, hairState = () => null }) {
    this.g = group;
    this.getLook = getLook;
    this.getDesign = getDesign;
    this.audio = audio;
    this.reducedMotion = reducedMotion;
    this.onReact = onReact;
    this.hairState = hairState;
    this.p = newPrefix('mimi');
    this.mood = 'fericita';
    this.tempExpr = null;
    this.tempUntil = 0;
    this.blinkAt = performance.now() + 1500;
    this.blinkT = -1;
    this.earT = { L: 0, R: 0, targetL: 0, targetR: 0, next: performance.now() + 2000 };
    this.pupil = { x: 0, y: 0, tx: 0, ty: 0 };
    this.lastPointer = 0;
    this.turn = 0; // 0..1 întoarcere (când o atingi pe coadă)
    this.turnT = -1;
    this.bounce = 0;
    this.render();
    if (scope) {
      scope.loop((dt, t) => this.update(dt, t));
      scope.on(window, 'pointermove', (e) => this.lookAtClient(e.clientX, e.clientY));
      scope.on(window, 'pointerdown', (e) => this.lookAtClient(e.clientX, e.clientY));
    }
  }

  get expr() {
    if (this.tempExpr && performance.now() < this.tempUntil) return this.tempExpr;
    return EXPR_BY_MOOD[this.mood] || 'happy';
  }

  render() {
    this.renderedExpr = this.expr;
    this.g.innerHTML = renderFigure({ look: this.getLook(), design: this.getDesign(), kind: 'mimi', expr: this.renderedExpr, p: this.p, hairState: this.hairState() });
    const q = (id) => this.g.querySelector(`#${this.p}-${id}`);
    this.refs = {
      all: q('all'), head: q('head'), tail: q('tail'), earL: q('earL'), earR: q('earR'),
      eyeL: q('eyeL'), eyeR: q('eyeR'), pupL: q('pupL'), pupR: q('pupR'),
    };
  }

  setMood(mood) {
    if (mood === this.mood) return;
    this.mood = mood;
    if (!this.tempExpr) this.render();
  }

  // Expresie pentru scurt timp (ms), apoi revine la starea de bază.
  flash(expr, ms = 1500) {
    this.tempExpr = expr;
    this.tempUntil = performance.now() + ms;
    this.render();
  }

  lookAtClient(cx, cy) {
    const m = this.g.getScreenCTM?.();
    if (!m) return;
    const inv = m.inverse();
    const x = cx * inv.a + cy * inv.c + inv.e;
    const y = cx * inv.b + cy * inv.d + inv.f;
    const dx = x - 150, dy = y - 128;
    const d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, d / 160);
    this.pupil.tx = (dx / d) * 5 * k;
    this.pupil.ty = (dy / d) * 4.5 * k;
    this.lastPointer = performance.now();
  }

  // Ce zonă a lui Angy a fost atinsă (după elementul atins).
  zoneOf(target) {
    if (!target?.closest) return null;
    if (target.closest(`#${this.p}-tail`)) return 'tail';
    if (target.closest(`#${this.p}-earL`) || target.closest(`#${this.p}-earR`)) return 'ear';
    if (target.closest(`#${this.p}-head`)) return 'head';
    if (target.closest('.fig-legs')) return 'feet';
    if (target.closest(`#${this.p}-body`) || target.closest('.fig-dress') || target.closest('.fig-over')) return 'belly';
    return null;
  }

  // Reacție la atingere. Întoarce zona (sau null).
  react(target) {
    const zone = this.zoneOf(target);
    if (!zone) return null;
    if (this.mood === 'adormita' && zone !== 'head') {
      this.audio?.play('zzz');
      this.onReact?.('sleepy', zone);
      return zone;
    }
    switch (zone) {
      case 'head':
        this.flash('purr', 1800); this.audio?.play('purr'); break;
      case 'ear':
        this.earT.targetL = -22; this.earT.targetR = 22; this.earT.next = performance.now() + 400;
        this.flash('giggle', 900); this.audio?.play('giggle'); break;
      case 'belly':
      case 'feet':
        this.flash('giggle', 1400); this.audio?.play('giggle'); this.bounce = 1; break;
      case 'tail':
        this.turnT = 0; this.flash('curious', 1300); this.audio?.play('meow'); break;
      default: break;
    }
    this.onReact?.(zone, zone);
    return zone;
  }

  update(dt, t) {
    if (!this.refs?.all) return;
    if (this.tempExpr && t > this.tempUntil) { this.tempExpr = null; this.render(); }
    if (this.renderedExpr !== this.expr) this.render();
    const reduce = this.reducedMotion();
    const r = this.refs;
    const sleeping = this.expr === 'sleep';

    // respirație (mai lentă în somn) + mic salt după gâdilat
    const br = reduce ? 0 : Math.sin(t / (sleeping ? 900 : 520)) * (sleeping ? 0.02 : 0.012);
    this.bounce = Math.max(0, this.bounce - dt * 2.5);
    const hop = reduce ? 0 : Math.sin(this.bounce * Math.PI) * 10 * this.bounce;
    // întoarcere (coada)
    let flip = 1;
    if (this.turnT >= 0) {
      this.turnT += dt / (reduce ? 0.3 : 1.1);
      const k = this.turnT;
      flip = Math.cos(Math.min(1, k) * Math.PI * 2);
      if (k >= 1) { this.turnT = -1; flip = 1; }
    }
    r.all.setAttribute('transform', `translate(150 400) scale(${flip.toFixed(3)} ${(1 + br).toFixed(4)}) translate(-150 ${(-400 - hop).toFixed(2)})`);
    if (r.head) r.head.setAttribute('transform', `translate(0 ${(reduce ? 0 : Math.sin(t / 520 + 0.6) * 1.2).toFixed(2)})`);

    // coada
    if (r.tail) {
      const a = reduce ? 0 : Math.sin(t / (sleeping ? 1400 : 700)) * (sleeping ? 3 : 9);
      r.tail.setAttribute('transform', `rotate(${a.toFixed(2)} 182 330)`);
    }

    // urechi: tresar din când în când
    const e = this.earT;
    if (t > e.next) {
      if (e.targetL || e.targetR) { e.targetL = 0; e.targetR = 0; e.next = t + 2500 + Math.random() * 4000; }
      else if (!reduce && !sleeping) { const which = Math.random(); e.targetL = which < 0.6 ? -14 : 0; e.targetR = which > 0.4 ? 14 : 0; e.next = t + 180; }
    }
    e.L += (e.targetL - e.L) * Math.min(1, dt * 18);
    e.R += (e.targetR - e.R) * Math.min(1, dt * 18);
    if (r.earL) r.earL.setAttribute('transform', `rotate(${e.L.toFixed(2)} 100 62)`);
    if (r.earR) r.earR.setAttribute('transform', `rotate(${e.R.toFixed(2)} 200 62)`);

    // clipit
    if (r.eyeL && r.pupL) {
      if (this.blinkT < 0 && t > this.blinkAt) this.blinkT = 0;
      let sy = 1;
      if (this.blinkT >= 0) {
        this.blinkT += dt / 0.16;
        sy = Math.max(0.08, Math.abs(1 - this.blinkT * 2));
        if (this.blinkT >= 1) { this.blinkT = -1; this.blinkAt = t + 2200 + Math.random() * 3500; sy = 1; }
      }
      r.eyeL.setAttribute('transform', `translate(114 128) scale(1 ${sy.toFixed(3)}) translate(-114 -128)`);
      r.eyeR.setAttribute('transform', `translate(186 128) scale(1 ${sy.toFixed(3)}) translate(-186 -128)`);
      // privirea urmărește degetul; dacă nu atingi nimic, se uită ușor în jur
      if (t - this.lastPointer > 4000) {
        this.pupil.tx = Math.sin(t / 1900) * 3;
        this.pupil.ty = Math.sin(t / 2700) * 1.5;
      }
      const pu = this.pupil;
      pu.x += (pu.tx - pu.x) * Math.min(1, dt * 10);
      pu.y += (pu.ty - pu.y) * Math.min(1, dt * 10);
      const tr = `translate(${pu.x.toFixed(2)} ${pu.y.toFixed(2)})`;
      r.pupL.setAttribute('transform', tr);
      r.pupR.setAttribute('transform', tr);
    }
  }
}

Object.assign(__exports, { MimiLive });
};
__defs['src/art/figure.js'] = function (__exports) {
// Desenul lui Angy (și al manechinului) pe straturi:
// aripi, coadă, păr spate, picioare, șosete/pantofi, corp, rochie, mănuși/poșetă, eșarfă/bijuterii,
// cap + față, păr față, urechi + cercei, ochelari, accesorii de cap.

const { mirrorPath, sparkle, starPoints, heartPath, newPrefix } = __require('src/art/svg.js');
const { shade } = __require('src/core/util.js');

const FUR = '#fffaf8';
const FUR_LINE = '#efc3d3';
const BELLY = '#ffffff';
const EAR_IN = '#ffadc9';

const TORSO = 'M150 196 C 125 196 112 205 112 222 C 112 245 118 262 120 270 C 114 285 112 300 118 312 L 182 312 C 188 300 186 285 180 270 C 182 262 188 245 188 222 C 188 205 175 196 150 196 Z';
const ARM_L = 'M118 210 C 104 218 94 244 92 276 L 108 278 C 110 252 116 234 126 220 Z';

__defs['src/core/wardrobe.js'] = function (__exports) {
// Garderoba: rochiile salvate, cu nume, favorite și filtre. Funcții pure.

const { clone, uid } = __require('src/core/util.js');

const MAX_NAME = 24;

// Categoria unei ținute, după tipul ei.
function designCategory(design) {
  const t = design?.type;
  if (t === 'pijama') return 'pijamale';
  if (t === 'carnaval') return 'costume';
  if (t === 'bluza' || t === 'salopeta') return 'tinute';
  return 'rochii';
}

const WARDROBE_FILTERS = [
  { id: 'toate', name: 'Toate', icon: '👗' },
  { id: 'favorite', name: 'Favorite', icon: '💖' },
  { id: 'rochii', name: 'Rochii', icon: '👗' },
  { id: 'tinute', name: 'Ținute', icon: '👚' },
  { id: 'pijamale', name: 'Pijamale', icon: '🌙' },
  { id: 'costume', name: 'Costume', icon: '🎭' },
];

function cleanName(name, fallback = 'Rochie') {
  const s = String(name ?? '').replace(/\s+/g, ' ').trim().slice(0, MAX_NAME);
  return s || fallback;
}

function addDesign(state, design, name) {
  const num = state.nextDesignNum || 1;
  state.nextDesignNum = num + 1;
  const entry = {
    id: uid('d'),
    name: cleanName(name, `Creația mea ${num}`),
    fav: false,
    created: Date.now(),
    design: clone(design),
  };
  state.wardrobe.unshift(entry);
  return entry;
}

// Actualizează o rochie existentă (când o editezi din nou).
function updateDesign(state, id, design) {
  const e = state.wardrobe.find((w) => w.id === id);
  if (!e) return null;
  e.design = clone(design);
  return e;
}

function renameDesign(state, id, name) {
  const e = state.wardrobe.find((w) => w.id === id);
  if (!e) return null;
  e.name = cleanName(name, e.name);
  return e;
}

function removeDesign(state, id) {
  const i = state.wardrobe.findIndex((w) => w.id === id);
  if (i < 0) return false;
  state.wardrobe.splice(i, 1);
  if (state.atelier?.editingId === id) state.atelier.editingId = null;
  return true;
}

function toggleFavorite(state, id) {
  const e = state.wardrobe.find((w) => w.id === id);
  if (!e) return null;
  e.fav = !e.fav;
  return e.fav;
}

function filterWardrobe(list, filter = 'toate') {
  if (filter === 'toate') return list.slice();
  if (filter === 'favorite') return list.filter((w) => w.fav);
  return list.filter((w) => designCategory(w.design) === filter);
}

Object.assign(__exports, { MAX_NAME, designCategory, WARDROBE_FILTERS, cleanName, addDesign, updateDesign, renameDesign, removeDesign, toggleFavorite, filterWardrobe });
};

// Desenul camerei lui Angy: perete, fereastră (după ora reală), podea, obiecte, lumină de noapte.

const { starPoints, MOTIFS } = __require('src/art/svg.js');

const furnById = new Map(FURNITURE.map((f) => [f.id, f]));
function furnitureDef(id) { return furnById.get(id) || null; }

// Ordinea de desen: obiecte de perete, covoare, apoi restul după `z`.
function sortedItems(items) {
  const rank = (it) => { const d = furnById.get(it.id); return d?.wall ? 0 : d?.flat ? 1 : 2; };
  return items.slice().sort((a, b) => rank(a) - rank(b) || (a.z || 0) - (b.z || 0));

function windowSky(phase) {
  switch (phase) {
    case 'morning': return { a: '#ffd1dc', b: '#ffe9b0', sun: '#ffd36b', sunY: 150 };
    case 'evening': return { a: '#ff9a76', b: '#9b6bff', sun: '#ff7b54', sunY: 150 };
    case 'night': return { a: '#1b1840', b: '#3a3570', moon: true };
    default: return { a: '#7fd1ff', b: '#d3f1ff', sun: '#ffe27a', sunY: 90 };
  }
}

function renderItem(it, { interactive = false, selected = false } = {}) {
  const def = furnById.get(it.id);
  if (!def) return '';

  const sx = (it.flip ? -1 : 1) * s;
  const hit = interactive ? '<rect x="-60" y="-70" width="120" height="80" fill="transparent"/>' : '';

    out += `<ellipse cx="${it.x}" cy="${it.y + r}" rx="${62 * s}" ry="${62 * s}" fill="none" stroke="#7c4dff" stroke-width="3" stroke-dasharray="8 6" class="sel-ring" pointer-events="none"/>`;
  }

}

function renderRoom(room, { p = 'room', phase = 'day', dark = false, interactive = false, selected = null, grid = false } = {}) {
  const wpDef = (WALLPAPERS.find((w) => w.id === room.wallpaper) || WALLPAPERS[0]).draw(p);

    <linearGradient id="${p}-flsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".3" stop-color="#000" stop-opacity="0"/></linearGradient>
    <radialGradient id="${p}-glow"><stop offset="0" stop-color="#fff3b0" stop-opacity=".85"/><stop offset=".5" stop-color="#ffe27a" stop-opacity=".3"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
  </defs>`;
  s += `<rect width="${ROOM_W}" height="${FLOOR_Y}" fill="${wpDef.fill}"/>`;
  // fereastra
  s += `<g class="window"><rect x="34" y="46" width="120" height="120" rx="10" fill="#fff" stroke="#e8c8d8" stroke-width="4"/><rect x="42" y="54" width="104" height="104" rx="6" fill="url(#${p}-sky)"/>`;
  if (sky.moon) {

    s += `<circle cx="112" cy="${sky.sunY - 10}" r="17" fill="${sky.sun}"/>`;
    s += `<g transform="translate(72 90) scale(1.3)">${MOTIFS.nor('#ffffff')}</g>`;
  }
  s += '<path d="M94 54 L 94 158 M42 106 L 146 106" stroke="#fff" stroke-width="5"/><path d="M30 44 Q 52 110 40 170 L 30 170 Z M158 44 Q 136 110 148 170 L 158 170 Z" fill="#ff8fc7" opacity=".85"/><rect x="24" y="38" width="140" height="10" rx="5" fill="#c08a5b"/></g>';

  s += `<rect y="${FLOOR_Y}" width="${ROOM_W}" height="${ROOM_H - FLOOR_Y}" fill="${flDef.fill}"/>`;
  s += `<rect y="${FLOOR_Y}" width="${ROOM_W}" height="${ROOM_H - FLOOR_Y}" fill="url(#${p}-flsh)"/>`;

// Transformă coordonatele ecranului în coordonatele SVG-ului (viewBox).
function svgPoint(svg, clientX, clientY) {

// handlers: onStart(p, e), onMove(p, delta, e), onPinch({scale, rotate}), onEnd(p, info), onTap(p, e)
// `toLocal(clientX, clientY)` transformă coordonatele (implicit: ecran).
function gesture(el, handlers, scope, toLocal = (x, y) => ({ x, y })) {

  let start = null;
  let moved = 0;
  let pinch = null;
  let last = null;

  const down = (e) => {
    if (e.button !== undefined && e.button > 0) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { el.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    if (pointers.size === 1) {
      start = toLocal(e.clientX, e.clientY);
      last = start;
      moved = 0;
      pinch = null;
      if (handlers.onStart?.(start, e) === false) { pointers.delete(e.pointerId); start = null; return; }
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(b.x - a.x, b.y - a.y) || 1, ang: Math.atan2(b.y - a.y, b.x - a.x) };
      handlers.onPinchStart?.();
    }
    e.preventDefault();
  };

  const move = (e) => {
    if (!pointers.has(e.pointerId) || !start) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size >= 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      handlers.onPinch?.({ scale: d / pinch.d, rotate: ((ang - pinch.ang) * 180) / Math.PI });
      moved = 99;
      return;
    }
    const p = toLocal(e.clientX, e.clientY);
    moved += Math.hypot(p.x - last.x, p.y - last.y);

  };

  const up = (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0 && start) {
      const p = toLocal(e.clientX, e.clientY);
      const info = { moved, pinched: !!pinch };
      if (moved < 6 && !pinch) handlers.onTap?.(p, e);
      handlers.onEnd?.(p, info, e);
      start = null;
      pinch = null;
    } else if (pointers.size === 1 && pinch) {
      // după ciupire continuăm tragerea cu degetul rămas
      const [only] = [...pointers.values()];
      last = toLocal(only.x, only.y);
      pinch = null;
      handlers.onPinchEnd?.();
    }
  };

  const opts = { passive: false };
  if (scope) {
    scope.on(el, 'pointerdown', down, opts);
    scope.on(el, 'pointermove', move, opts);
    scope.on(el, 'pointerup', up);
    scope.on(el, 'pointercancel', up);
  } else {
    el.addEventListener('pointerdown', down, opts);
    el.addEventListener('pointermove', move, opts);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }
}

__defs['src/core/history.js'] = function (__exports) {
// Istoric pentru Anulează / Refă. Ținem "fotografii" (copii) ale stării.
// Ultimul element din `past` este starea curentă.

const { clone } = __require('src/core/util.js');

class History {
  constructor(limit = 60) {
    this.limit = Math.max(2, limit);
    this.past = [];
    this.future = [];
  }

  // Pornește istoricul de la o stare (fără nimic de anulat).
  reset(snapshot) {
    this.past = [clone(snapshot)];
    this.future = [];
  }

  // Salvează o stare nouă. Dacă e identică cu cea curentă, nu face nimic.
  push(snapshot) {
    const json = JSON.stringify(snapshot);
    const current = this.past[this.past.length - 1];
    if (current !== undefined && JSON.stringify(current) === json) return false;
    this.past.push(JSON.parse(json));
    if (this.past.length > this.limit) this.past.shift();
    this.future = [];
    return true;
  }

  get canUndo() { return this.past.length > 1; }
  get canRedo() { return this.future.length > 0; }

  current() { return clone(this.past[this.past.length - 1]); }

  undo() {
    if (!this.canUndo) return null;
    this.future.push(this.past.pop());
    return this.current();
  }

  redo() {
    if (!this.canRedo) return null;
    this.past.push(this.future.pop());
    return this.current();
  }
}

Object.assign(__exports, { History });
};

// Roata de culori: atingi ca să alegi nuanța (unghi) și intensitatea (distanța de la centru).
function colorWheel(onPick, size = 150) {
  const wheel = h('div', {
    class: 'color-wheel', role: 'slider', 'aria-label': 'Roata de culori', tabindex: '0',
    style: {

    },

    const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);

    let hue = (Math.atan2(y, x) * 180) / Math.PI;

        ctx.audio.tone({ freq: 900, to: 600, dur: 0.18, vol: 0.2, type: 'square', filter: { type: 'bandpass', freq: 1200, q: 3 } });

      });
    }
    const mimiG = svg.querySelector('.mimi');
    const pawsG = svg.querySelector('.paws');
    const canvas = h('canvas', { class: 'wash-canvas', style: { position: 'absolute', inset: '0', width: '100%', height: '100%', pointerEvents: 'none' } });
    const stage = h('div', { class: 'editor-stage' }, svg, canvas);
    const mimi = new MimiLive(mimiG, {
      getLook: () => s.look,
      getDesign: () => (tab === 'wash' ? null : s.look.outfit),
      scope, audio: ctx.audio,
      reducedMotion: () => s.settings.reducedMotion,
      hairState: () => (tab === 'hair' || tab === 'wash' ? hairState : null),
    });
    const undoBtn = btn({ icon: '↩️', title: 'Anulează', onClick: () => undoRedo('undo') });
    const redoBtn = btn({ icon: '↪️', title: 'Refă', onClick: () => undoRedo('redo') });
    const doneBtn = btn({ icon: '⭐', label: 'Gata!', cls: 'btn-ok', say: true, onClick: () => finishStation(doneBtn) });
    stage.appendChild(h('div', { class: 'stage-tools' }, undoBtn, redoBtn, h('div', { class: 'spacer' }), doneBtn));
    const toolCursor = h('div', { class: 'wand', hidden: true }, '');
    document.body.appendChild(toolCursor);
    scope.add(() => toolCursor.remove());

    const panelBody = h('div', { class: 'panel-body' });
    const tabRow = tabs(TABS, tab, (id) => { tab = id; setupTab(); });
    if (bath) tabRow.hidden = true;
    root.appendChild(h('div', { class: 'editor' }, stage, h('div', { class: 'editor-panel' }, tabRow, panelBody)));
    const label = (t) => h('div', { class: 'panel-label' }, t);

    function refreshTools() {
      undoBtn.disabled = !hist.canUndo;
      redoBtn.disabled = !hist.canRedo;
      doneBtn.hidden = tab === 'wash' || tab === 'face';
    }
    function lookChanged(kind) {
      hist.push(s.look);
      changedSinceReward[kind] = true;
      ctx.store.commit();
      mimi.render();
      if (tab === 'nails') drawPaws();
      refreshTools();
    }
    function undoRedo(which) {
      const snap = which === 'undo' ? hist.undo() : hist.redo();
      if (!snap) return;
      s.look = snap;
      ctx.store.commit();
      ctx.audio.play('whoosh');
      mimi.render();
      if (tab === 'nails') drawPaws();
      renderPanel();
      refreshTools();
    }
    function finishStation(el) {
      const kind = tab === 'acc' ? 'acc' : tab;
      if (!changedSinceReward[kind]) { toast('Încearcă ceva nou mai întâi! ✨', '💡'); ctx.audio.play('soft-no'); return; }
      changedSinceReward[kind] = false;
      ctx.track({ face: 'face', hair: 'hair', makeup: 'makeup', nails: 'nails', acc: 'salonacc' }[kind]);
      care(s.pet, 'love', 4);
      ctx.reward(3, el);
      mimi.flash('giggle', 1400);
      ctx.audio.play('tada');
      const r = stage.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, ['✨', '💖', '⭐'], 14);
      toast(['Arată superb!', 'Minunat!', 'Ce frumoasă e!', 'Bravo!'][Math.floor(Math.random() * 4)], '💖');
    }

    // Pensula zboară de la buton spre un punct de pe Angy.
    function flyBrush(fromEl, fx, fy, icon = '🖌️') {
      const m = mimiG.getScreenCTM();
      if (!m || !fromEl) return;
      const tx = fx * m.a + fy * m.c + m.e, ty = fx * m.b + fy * m.d + m.f;
      const r = fromEl.getBoundingClientRect();
      const el = h('div', { class: 'wand', style: { left: `${r.left + r.width / 2}px`, top: `${r.top + r.height / 2}px` } }, icon);
      document.body.appendChild(el);
      const dur = s.settings.reducedMotion ? 1 : 450;
      const anim = el.animate?.([
        { transform: 'translate(-50%,-50%) scale(.8)' },
        { transform: `translate(calc(-50% + ${tx - r.left - r.width / 2}px), calc(-50% + ${ty - r.top - r.height / 2}px)) scale(1.1) rotate(-20deg)` },
      ], { duration: dur, easing: 'ease-in-out', fill: 'forwards' });
      const done = () => { el.remove(); burst(tx, ty, ['✨'], 4); };
      if (anim) anim.onfinish = done; else setTimeout(done, dur);
      scope.add(() => el.remove());
    }

    // ================= SPĂLAT =================
    const CELL = 12;
    let wash = null; // { cells:[{x,y,dirt,foam,wet}], step:'soap'|'rinse'|'dry'|'done', drops:[] }
    function insideBody(x, y) {
      if (bath && y > 292) return false; // în cadă: doar ce se vede deasupra spumei
      if (((x - 150) / 92) ** 2 + ((y - 118) / 80) ** 2 < 1) return true;
      if (x > 114 && x < 186 && y > 196 && y < 312) return true;
      if (x > 124 && x < 176 && y > 300 && y < 398) return true;
      if (y > 210 && y < 296 && ((x > 86 && x < 124) || (x > 176 && x < 214))) return true;
      return false;
    }
    function newWash() {
      const dirtiness = clamp(1 - s.pet.needs.clean / 100, 0.35, 0.9);
      const cells = [];
      for (let y = 30; y < 400; y += CELL) for (let x = 56; x < 246; x += CELL) if (insideBody(x, y)) cells.push({ x, y, dirt: 0, foam: 0, wet: 0 });
      const blobs = 6 + Math.round(dirtiness * 10);
      for (let i = 0; i < blobs; i++) {
        const c = cells[Math.floor(Math.random() * cells.length)];
        const r = 18 + Math.random() * 22;
        for (const d of cells) if (Math.hypot(d.x - c.x, d.y - c.y) < r) d.dirt = Math.max(d.dirt, 0.6 + Math.random() * 0.4);
      }
      return { cells, step: 'soap', drops: [], progress: 0 };
    }
    function sizeCanvas() {
      const r = stage.getBoundingClientRect();
      const dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(r.width * dpr));
      canvas.height = Math.max(1, Math.round(r.height * dpr));
    }
    function drawWash() {
      const g = canvas.getContext('2d');
      g.clearRect(0, 0, canvas.width, canvas.height);
      if (tab !== 'wash' || !wash) return;
      const m = mimiG.getScreenCTM();
      const cr = canvas.getBoundingClientRect();
      if (!m || !cr.width) return;
      const k = canvas.width / cr.width;
      const tx = (x, y) => [(x * m.a + y * m.c + m.e - cr.left) * k, (x * m.b + y * m.d + m.f - cr.top) * k];
      const scale = m.a * k;
      for (const c of wash.cells) {
        const [cx, cy] = tx(c.x, c.y);
        if (c.wet > 0.05) { g.fillStyle = `rgba(120,190,255,${0.22 * c.wet})`; g.beginPath(); g.arc(cx, cy, CELL * 0.75 * scale, 0, 7); g.fill(); }
        if (c.dirt > 0.03) { g.fillStyle = `rgba(139,94,60,${0.7 * c.dirt})`; g.beginPath(); g.arc(cx, cy, CELL * 0.85 * scale, 0, 7); g.fill(); }
      }
      for (const c of wash.cells) {
        if (c.foam <= 0.05) continue;
        const [cx, cy] = tx(c.x, c.y);
        const r = CELL * (0.35 + 0.45 * c.foam + ((c.x * 13 + c.y * 7) % 5) * 0.06) * scale;
        g.fillStyle = 'rgba(255,255,255,.92)'; g.strokeStyle = 'rgba(150,200,255,.8)'; g.lineWidth = 1.2 * k;
        const jx = (((c.x * 31 + c.y * 17) % 11) - 5) * scale, jy = (((c.x * 13 + c.y * 29) % 11) - 5) * scale;
        g.beginPath(); g.arc(cx + jx, cy + jy, r, 0, 7); g.fill(); g.stroke();
        g.fillStyle = 'rgba(255,255,255,1)'; g.beginPath(); g.arc(cx + jx - r * 0.3, cy + jy - r * 0.3, r * 0.25, 0, 7); g.fill();
      }
      g.fillStyle = 'rgba(110,190,255,.85)';
      for (const d of wash.drops) {
        const [cx, cy] = tx(d.x, d.y);
        g.beginPath(); g.ellipse(cx, cy, 2.2 * k, 5 * k, 0, 0, 7); g.fill();
      }
    }
    function washProgress() {
      const cs = wash.cells;
      if (wash.step === 'soap') return cs.filter((c) => c.foam > 0.45).length / cs.length / 0.6;
      if (wash.step === 'rinse') return cs.filter((c) => c.foam < 0.1 && c.dirt < 0.1).length / cs.length / 0.92;
      if (wash.step === 'dry') return cs.filter((c) => c.wet < 0.15).length / cs.length / 0.85;
      return 1;
    }
    function washAt(pt) {
      if (!wash || wash.step === 'done') return;
      if (wash.step === 'soap') {
        for (const c of wash.cells) { const d = Math.hypot(c.x - pt.x, c.y - pt.y); if (d < 26) c.foam = Math.min(1, c.foam + 0.22 * (1 - d / 26) + 0.05); }
        ctx.audio.play('scrub', 120);
      } else if (wash.step === 'rinse') {
        for (let i = 0; i < 3; i++) wash.drops.push({ x: pt.x + (Math.random() - 0.5) * 30, y: pt.y, vy: 260 + Math.random() * 120 });
        for (const c of wash.cells) {
          if (Math.abs(c.x - pt.x) < 22 && c.y > pt.y - 10 && c.y < pt.y + 130) {
            c.foam = Math.max(0, c.foam - 0.12);
            if (c.foam < 0.3) c.dirt = Math.max(0, c.dirt - 0.1);
            c.wet = Math.min(1, c.wet + 0.2);
          }
        }
        ctx.audio.play('water', 160);
      } else if (wash.step === 'dry') {
        for (const c of wash.cells) { const d = Math.hypot(c.x - pt.x, c.y - pt.y); if (d < 30) c.wet = Math.max(0, c.wet - 0.15); }
        ctx.audio.play('brush', 180);
        if (Math.random() < 0.15) { const m = mimiG.getScreenCTM(); if (m) burst(pt.x * m.a + pt.y * m.c + m.e, pt.x * m.b + pt.y * m.d + m.f, ['✨'], 2); }

    let washBar = null, washHint = null, washSteps = null;
    function updateWashPanel() {

    function nextWashStep() {

    // ================= PĂR: pieptene și foehn =================
    let hairTool = 'comb';
    let lastHairRender = 0;
    function hairAt(pt) {
      if (pt.y > 200 || pt.y < -20) return;
      if (hairTool === 'comb') {
        hairState.messy = Math.max(0, hairState.messy - 0.02);
        ctx.audio.play('brush', 200);
      } else {
        hairState.wet = Math.max(0, hairState.wet - 0.025);
        hairState.messy = Math.max(0, hairState.messy - 0.006);

        const m = mimiG.getScreenCTM();
        if (m && Math.random() < 0.3) burst(pt.x * m.a + pt.y * m.c + m.e, pt.x * m.b + pt.y * m.d + m.f, ['💨'], 1);
      }
      const now = performance.now();
      if (now - lastHairRender > 90) { lastHairRender = now; mimi.render(); }
      if (hairState.messy === 0 && hairState.wet === 0 && !hairState.announced) {
        hairState.announced = true;
        changedSinceReward.hair = true;
        ctx.audio.play('sparkle');

        mimi.render();
      }
    }

    // ---- gesturi pe scenă ----
    svgGesture(svg, {
      onStart(pt, e) {
        if (tab === 'nails') {
          const n = e.target.closest?.('[data-nail]');
          if (n) toggleNail(Number(n.dataset.nail));

      },
      onMove(pt, d, e) {

      },
      onEnd() { toolCursor.hidden = true; },
    }, scope);
    function moveCursor(e) {
      toolCursor.textContent = tab === 'wash' ? ({ soap: '🧽', rinse: '🚿', dry: '🧺', done: '✨' }[wash?.step] || '🧽') : hairTool === 'comb' ? '🪮' : '💨';
      toolCursor.style.left = `${e.clientX}px`;
      toolCursor.style.top = `${e.clientY - 20}px`;
    }
    function handleTool(e) {
      // coordonate în spațiul lui Angy
      const m = mimiG.getScreenCTM();
      if (!m) return;
      const inv = m.inverse();
      const pt = { x: e.clientX * inv.a + e.clientY * inv.c + inv.e, y: e.clientX * inv.b + e.clientY * inv.d + inv.f };
      if (tab === 'wash') washAt(pt); else hairAt(pt);

    // ================= UNGHII =================
    const selectedNails = new Set([0]);
    function drawPaws() { pawsG.innerHTML = tab === 'nails' ? pawsMarkup(s.look.nails, p, selectedNails) : ''; }
    function toggleNail(i) {

    function applyNails(fn, fromEl) {
      for (const i of selectedNails) fn(s.look.nails[i]);
      ctx.audio.play('brush');
      lookChanged('nails');
      const pulse = pawsG.querySelector(`[data-nail="${[...selectedNails][0]}"]`);
      if (pulse) { const r = pulse.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, ['✨', '💅'], 5); }
    }

    // ================= panouri =================
    let makeupPart = 'shadow';
    let accSlot = 'bow';
    function renderPanel() {
      panelBody.innerHTML = '';
      const add = (...els) => els.forEach((e) => panelBody.appendChild(e));
      const L = s.look;
      switch (tab) {
        case 'face': {
          add(label('Tratament de spa pentru față'));
          add(h('div', { class: 'row' },
            btn({ icon: '🧖', label: spa.towel ? 'Prosop: DA' : 'Prosop pe cap', cls: spa.towel ? 'on' : 'btn-soft', onClick: () => { spa.towel = !spa.towel; spaChanged(); } }),
            btn({ icon: '🥒', label: spa.cucumber ? 'Castraveți: DA' : 'Castraveți', cls: spa.cucumber ? 'on' : 'btn-soft', onClick: () => { spa.cucumber = !spa.cucumber; spaChanged(); } })));
          add(label('Mască'), optionRow(MASKS, spa.mask, (o) => { spa.mask = spa.mask === o.id ? null : o.id; spaChanged(); }));
          add(btn({ icon: '🚿', label: 'Clătește fața (gata!)', cls: 'btn-primary btn-big', say: true, onClick: (e) => {
            if (!spa.mask && !spa.cucumber && !spa.towel) { toast('Pune întâi o mască sau castraveți! 🥒', '💡'); ctx.audio.play('soft-no'); return; }
            spa.mask = null; spa.cucumber = false; spa.towel = false;
            ctx.audio.play('water');
            care(s.pet, 'clean', 10);
            changedSinceReward.face = true;

            renderPanel();
          } }));
          break;
        }
        case 'wash': {
          const steps = [['soap', '🧽', 'Săpun'], ['rinse', '🚿', 'Duș'], ['dry', '🧺', 'Prosop']];
          washSteps = h('div', { class: 'tailor-steps' }, steps.map(([id, ic, nm]) => {
            const idx = steps.findIndex((x) => x[0] === wash.step);
            const my = steps.findIndex((x) => x[0] === id);
            return h('div', { class: `step-dot ${wash.step === id ? 'on' : ''} ${wash.step === 'done' || my < idx ? 'done' : ''}`, title: nm }, ic);
          }));
          const text = { soap: 'Freacă-o pe Angy cu buretele ca să facă spumă!', rinse: 'Trage dușul peste ea ca să clătești spuma și noroiul!', dry: 'Șterge-o cu prosopul până se usucă!', done: 'Gata! Angy e curată! 🫧' }[wash.step];
          washHint = h('p', { class: 'hint' }, text);

        }
        case 'hair': {
          const toolRow = h('div', { class: 'row' },
            btn({ icon: '🪮', label: 'Pieptene', cls: hairTool === 'comb' ? 'on' : 'btn-soft', onClick: () => { hairTool = 'comb'; renderPanel(); } }),
            btn({ icon: '💨', label: 'Foehn', cls: hairTool === 'dryer' ? 'on' : 'btn-soft', onClick: () => { hairTool = 'dryer'; renderPanel(); } }),
            h('span', { class: 'hint' }, hairState.wet > 0 ? 'Usucă părul cu foehnul!' : hairState.messy > 0 ? 'Pieptănă părul ciufulit!' : 'Păr perfect! ✨'));
          add(toolRow);
          add(label('Coafura'), optionRow(HAIRSTYLES.map((x) => ({ ...x, icon: hairIcon(x) })), L.hair.style, (o) => { L.hair.style = o.id; ctx.audio.play('whoosh'); lookChanged('hair'); }));
          add(label('Culoarea părului'), swatches(HAIR_COLORS, L.hair.color, (c) => { L.hair.color = c; lookChanged('hair'); renderPanel(); }));
          const g = btn({ icon: L.hair.gradient ? '🌈' : '⬜', label: L.hair.gradient ? 'Degrade: DA' : 'Degrade: NU', cls: L.hair.gradient ? 'on' : 'btn-soft', onClick: () => { L.hair.gradient = !L.hair.gradient; lookChanged('hair'); renderPanel(); } });
          add(h('div', { class: 'row' }, g));
          if (L.hair.gradient) add(label('A doua culoare (vârfuri)'), swatches(HAIR_COLORS, L.hair.color2, (c) => { L.hair.color2 = c; lookChanged('hair'); renderPanel(); }));
          add(label('Împletituri și decor'), optionRow(HAIR_DECOR, L.hair.decor, (o) => { L.hair.decor = o.id; ctx.audio.play('sparkle'); lookChanged('hair'); renderPanel(); }));

          if (makeupPart === 'lashes') {
            add(label('Forma genelor'), optionRow(LASH_STYLES.map((x) => ({ ...x, icon: '👁️' })), part.style, (o, el) => { part.style = o.id; flyBrush(el, 150, 112, '🖌️'); ctx.audio.play('brush'); lookChanged('makeup'); }));
            add(label('Culoarea genelor'), swatches(['#3a2840', '#2d2a3a', '#7a4b2f', ...MAKEUP_COLORS.slice(0, 9)], part.color, (c) => { part.color = c; ctx.audio.play('brush'); lookChanged('makeup'); }));
          } else {
            add(label('Culoare'), swatches(MAKEUP_COLORS, part.color, (c) => {
              part.color = c;
              const [fx, fy] = MAKEUP_TARGET[makeupPart];

        case 'nails': {

          ));
